<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Business On Hold | Interactive Space</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Lato", sans-serif;
      user-select: none;
      background-color: #090a0f;
    }

    /* Outer Container */
    .container {
      height: 100vh;
      width: 100vw;
      background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
      overflow: hidden;
      position: relative;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
    }

    /* Base Star Styles */
    .star-layer {
      position: absolute;
      background: transparent;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    #stars {
      width: 1px;
      height: 1px;
      box-shadow: 
        501px 811px #fff, 1450px 1324px #fff, 1093px 1780px #fff, 1469px 678px #fff, 
        904px 741px #fff, 1160px 781px #fff, 1841px 1962px #fff, 1630px 1667px #fff, 
        367px 1734px #fff, 1343px 156px #fff, 1283px 1142px #fff, 1062px 378px #fff,
        439px 472px #fff, 1491px 677px #fff, 34px 382px #fff, 1221px 1584px #fff,
        659px 18px #fff, 1731px 1959px #fff, 80px 712px #fff, 326px 1605px #fff;
      animation: animStar 50s linear infinite;
    }
    #stars::after {
      content: " ";
      position: absolute;
      top: 2000px;
      width: 1px;
      height: 1px;
      background: transparent;
      box-shadow: 
        501px 811px #fff, 1450px 1324px #fff, 1093px 1780px #fff, 1469px 678px #fff, 
        904px 741px #fff, 1160px 781px #fff, 1841px 1962px #fff, 1630px 1667px #fff, 
        367px 1734px #fff, 1343px 156px #fff, 1283px 1142px #fff, 1062px 378px #fff,
        439px 472px #fff, 1491px 677px #fff, 34px 382px #fff, 1221px 1584px #fff,
        659px 18px #fff, 1731px 1959px #fff, 80px 712px #fff, 326px 1605px #fff;
    }

    #stars2 {
      width: 2px;
      height: 2px;
      box-shadow: 
        1925px 1320px #fff, 693px 1778px #fff, 1016px 711px #fff, 1171px 563px #fff, 
        661px 1919px #fff, 1610px 44px #fff, 1275px 140px #fff, 1208px 1802px #fff, 
        853px 1757px #fff, 1149px 937px #fff, 1353px 428px #fff, 270px 279px #fff, 
        666px 1097px #fff, 1425px 1278px #fff, 806px 156px #fff, 1252px 561px #fff;
      animation: animStar 100s linear infinite;
    }
    #stars2::after {
      content: " ";
      position: absolute;
      top: 2000px;
      width: 2px;
      height: 2px;
      background: transparent;
      box-shadow: 
        1925px 1320px #fff, 693px 1778px #fff, 1016px 711px #fff, 1171px 563px #fff, 
        661px 1919px #fff, 1610px 44px #fff, 1275px 140px #fff, 1208px 1802px #fff, 
        853px 1757px #fff, 1149px 937px #fff, 1353px 428px #fff, 270px 279px #fff, 
        666px 1097px #fff, 1425px 1278px #fff, 806px 156px #fff, 1252px 561px #fff;
    }

    #stars3 {
      width: 3px;
      height: 3px;
      box-shadow: 
        200px 981px #fff, 1731px 521px #fff, 132px 1039px #fff, 1888px 1547px #fff, 
        899px 1226px #fff, 1887px 580px #fff, 1548px 1092px #fff, 1626px 689px #fff, 
        672px 1267px #fff, 939px 668px #fff, 1969px 645px #fff, 1126px 983px #fff;
      animation: animStar 150s linear infinite;
    }
    #stars3::after {
      content: " ";
      position: absolute;
      top: 2000px;
      width: 3px;
      height: 3px;
      background: transparent;
      box-shadow: 
        200px 981px #fff, 1731px 521px #fff, 132px 1039px #fff, 1888px 1547px #fff, 
        899px 1226px #fff, 1887px 580px #fff, 1548px 1092px #fff, 1626px 689px #fff, 
        672px 1267px #fff, 939px 668px #fff, 1969px 645px #fff, 1126px 983px #fff;
    }

    /* Hyper-Speed Effect on Click */
    .hyper-speed #stars { animation-duration: 4s !important; }
    .hyper-speed #stars2 { animation-duration: 6s !important; }
    .hyper-speed #stars3 { animation-duration: 8s !important; }

    /* Title Section */
    #title {
      position: relative;
      margin-top: 12vh;
      color: #fff;
      text-align: center;
      font-weight: 300;
      font-size: 42px;
      letter-spacing: 6px;
      opacity: 0;
      transform: translateY(30px);
      animation: introFadeUp 1.2s ease-out forwards;
      pointer-events: none;
      z-index: 10;
      padding: 0 20px;
    }

    #title span {
      background: linear-gradient(180deg, #ffffff 0%, #7f97b0 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: block;
      text-transform: uppercase;
      font-weight: 700;
    }

    .sub-text {
      font-size: 15px;
      letter-spacing: 3px;
      color: #f7e479;
      margin-top: 18px;
      text-transform: uppercase;
      opacity: 0.9;
    }

    .sub-text #click-count {
      font-weight: bold;
      color: #ffffff;
      background: rgba(247, 228, 121, 0.2);
      padding: 2px 8px;
      border-radius: 4px;
      border: 1px solid rgba(247, 228, 121, 0.4);
    }

    /* Dino Loader Container */
    .dino-loader {
      width: 100%;
      max-width: 600px;
      height: 120px;
      position: relative;
      overflow: hidden;
      margin-bottom: 50px;
      z-index: 5;
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      filter: invert(1) hue-rotate(180deg); /* Dark Theme Compatibility */
      opacity: 0.85;
    }

    .dino-runner {
      width: 44px;
      height: 47px;
      position: absolute;
      bottom: 12px;
      left: 50%;
      margin-left: -22px;
      z-index: 2;
      background-image: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAQgAAAAvAgMAAABiRrxWAAAADFBMVEX///9TU1P39/f///+TS9URAAAAAXRSTlMAQObYZgAAAPpJREFUeF7d0jFKRkEMhdGLMM307itNLALyVmHvJuzTDMjdn72E95PGFEZSmeoU4YMMgxhskvQec8YSVFX1NhGcS5ywtbmC8khcZeKq+ZWJ4F8Sr2+ZCErjkJFEfcjAc/6/BMlfcz6xHdhRthYzIZhIHMcTVY1scUUiAphK8CMSPUbieTBhvD9Lj0vyV4wklEGzHpciKGOJoBp7XDcFs4kWxxM7Ey3iZ8JbzASAvMS7XLOJHTTvEkEZSeQl7DMuwVyCasqK5+XzQRYLUJlMbPXjFcn3m8eKBSjWZMJwvGIOvViAzCbUj1VEDoqFOEQGE3SyInJQLOQMJL4B7enP1UbLXJQAAAAASUVORK5CYII=");
      animation:
        dinoRun 0.25s infinite steps(2),
        dinoJump 1.5s infinite linear;
    }

    .dino-obstacle {
      width: 17px;
      height: 35px;
      position: absolute;
      bottom: 12px;
      right: -50px;
      z-index: 1;
      background-image: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAGYAAAAjCAMAAABRlI+PAAAADFBMVEX////////39/dTU1PhglcSAAAAAXRSTlMAQObYZgAAAPNJREFUeF7tlkEKwzAMBLXr//+5iQhU7gRRQkyhZI+DhwH74jhmO+oIJBVwURljuAXagG5QqkSgBLqg3JnxJ1Cb8SmQ3o6gpO85owGlOB4m2BNKJ11BSd01owGlOHkcIAuHkz6UNpPKgozPM54dADHjJuNhZiJxdQCQgZJeBczgCAAy3yhPJvcnmdC9mZwBIsQMFV5AkzHBNknFgcKM+oyDIFcfCAoy03m+jSMIcmoVZkKqSjr1fghyahRmoKRUHYLiSI1SMlCq5CDgX6BXmKkfn+oQ0KEyyrzoy8GbXJ9xrM/YjhUZgl9nnsyTCe9rgSRdV15CwRcIEu8GGQAAAABJRU5ErkJggg==");
      animation: moveObstacle 1.5s infinite linear;
    }

    .dino-ground {
      width: 100%;
      height: 12px;
      position: absolute;
      bottom: 0px;
      background-image: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABLAAAAAMAgMAAAAPCKxBAAAABlBMVEX///9TU1NYzE1OAAAAAXRSTlMAQObYZgAAALJJREFUeF7t1EEKAyEMhtEvMNm7sPfJEVyY+1+ltLgYAsrQCatWhbxEhQvgxIJtSZypxa/WGshgzKdbq/UihMFMlt3o/CspEYoihIMaAb6mCvM6C+BTAeyo+wN4yykV/6pVfkdLpVyI1hh7GJ6QunUoLEQlQglNP2nkQkeF8+ei9cLxMue1qxVRfk1Ej0s6AEGWfVOk0QUtnK5Xo0Lac6wpdtnQqB6VxomPaz+dgF1PaqqmeWJlz1jYUaSIAAAAASUVORK5CYII=");
      background-repeat: repeat-x;
      animation: moveGround 4s linear infinite;
    }

    /* Ripple Effect */
    .ripple {
      position: absolute;
      border: 1px solid rgba(247, 228, 121, 0.8);
      border-radius: 50%;
      transform: scale(0);
      animation: ripple-effect 0.8s ease-out;
      pointer-events: none;
    }

    /* Keyframe Animations */
    @keyframes animStar {
      from { transform: translateY(0px); }
      to { transform: translateY(-2000px); }
    }

    @keyframes introFadeUp {
      0% { opacity: 0; transform: translateY(30px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes ripple-effect {
      to {
        transform: scale(5);
        opacity: 0;
      }
    }

    @keyframes dinoRun {
      from { background-position: -44px 0; }
      to { background-position: -132px 0; }
    }

    @keyframes dinoJump {
      0%, 35% { transform: translateY(0); }
      50% { transform: translateY(-55px); }
      65%, 100% { transform: translateY(0); }
    }

    @keyframes moveObstacle {
      0% { right: -50px; }
      100% { right: 100%; }
    }

    @keyframes moveGround {
      from { background-position: 0 0; }
      to { background-position: -1200px 0; }
    }
  </style>
</head>
<body>

  <div class="container" id="spaceContainer">
    <div id="stars" class="star-layer"></div>
    <div id="stars2" class="star-layer"></div>
    <div id="stars3" class="star-layer"></div>

    <div id="title">
      <span>This business is on hold</span>
      <div class="sub-text">Click here <span id="click-count">100,000</span> times to see why</div>
    </div>

    <div class="dino-loader">
      <div class="dino-runner"></div>
      <div class="dino-obstacle"></div>
      <div class="dino-ground"></div>
    </div>
  </div>

  <script>
    const container = document.getElementById('spaceContainer');
    const clickCountEl = document.getElementById('click-count');
    
    let clicksRemaining = 100000;
    let isWarping = false;

    container.addEventListener('click', (e) => {
      // 1. Counter Decrement
      if (clicksRemaining > 0) {
        clicksRemaining--;
        clickCountEl.textContent = clicksRemaining.toLocaleString();
      }

      // 2. Ripple Visual Effect
      const ripple = document.createElement('div');
      ripple.classList.add('ripple');
      
      const size = 80;
      ripple.style.width = `${size}px`;
      ripple.style.height = `${size}px`;
      ripple.style.left = `${e.clientX - size / 2}px`;
      ripple.style.top = `${e.clientY - size / 2}px`;

      container.appendChild(ripple);

      setTimeout(() => {
        ripple.remove();
      }, 800);

      // 3. Hyper Speed Animation Trigger
      if (!isWarping) {
        isWarping = true;
        container.classList.add('hyper-speed');

        setTimeout(() => {
          container.classList.remove('hyper-speed');
          isWarping = false;
        }, 2000);
      }
    });
  </script>

</body>
</html>
