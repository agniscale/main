<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inactive Notice</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100vh;
      background-color: #090a0f;
      overflow: hidden;
      font-family: 'Poppins', sans-serif;
      position: relative;
    }

    /* Loader aur Card dono ko screen ke exact center me overlay karne ke liye */
    .loader-container, .card {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    /* ==================== LOADER CONTAINER ==================== */
    .loader-container {
      display: flex;
      justify-content: center;
      align-items: center;
      transition: opacity 0.4s ease-out;
      will-change: opacity;
      z-index: 2;
    }

    .loader-container.hide {
      opacity: 0;
      pointer-events: none;
      display: none;
    }

    /* ==================== LOADER STYLES ==================== */
    .loader {
      display: flex;
      justify-content: center;
      align-items: center;
      --color: #dddddd;
      --animation: 1.8s cubic-bezier(0.45, 0, 0.55, 1) infinite;
    }

    .loader .circle {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      width: 20px;
      height: 20px;
      border: 2px solid var(--color);
      border-radius: 50%;
      margin: 0 8px;
      background-color: transparent;
      animation: circle-keys var(--animation);
      will-change: transform, opacity;
    }

    .loader .circle .dot {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 14px;
      height: 14px;
      margin-top: -7px;
      margin-left: -7px;
      border-radius: 50%;
      background-color: var(--color);
      animation: dot-keys var(--animation);
      will-change: transform;
    }

    .loader .circle .outline {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 20px;
      height: 20px;
      margin-top: -10px;
      margin-left: -10px;
      border-radius: 50%;
      animation: outline-keys var(--animation);
      will-change: transform, opacity;
    }

    /* Delays Optimization */
    .circle:nth-child(2), .circle:nth-child(2) .dot { animation-delay: 0.2s; }
    .circle:nth-child(3), .circle:nth-child(3) .dot { animation-delay: 0.4s; }
    .circle:nth-child(4), .circle:nth-child(4) .dot { animation-delay: 0.6s; }

    .circle:nth-child(1) .outline { animation-delay: 0.6s; }
    .circle:nth-child(2) .outline { animation-delay: 0.8s; }
    .circle:nth-child(3) .outline { animation-delay: 1.0s; }
    .circle:nth-child(4) .outline { animation-delay: 1.2s; }

    @keyframes circle-keys {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.35); opacity: 0.5; }
    }

    @keyframes dot-keys {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(0); }
    }

    @keyframes outline-keys {
      0% { transform: scale(0); outline: 15px solid var(--color); opacity: 1; }
      100% { transform: scale(1); outline: 0px solid transparent; opacity: 0; }
    }

    /* ==================== CARD STYLES ==================== */
    .card {
      width: 310px;
      height: 76px;
      background: #232326;
      border-radius: 18px;
      display: flex;
      align-items: center;
      padding: 0 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
      opacity: 0;
      transform: translate(-50%, calc(-50% + 15px));
      transition: opacity 0.5s ease-out, transform 0.5s ease-out;
      will-change: transform, opacity;
      pointer-events: none;
      z-index: 1;
    }

    .card.show {
      opacity: 1;
      transform: translate(-50%, -50%);
      pointer-events: auto;
    }

    .card:hover {
      cursor: pointer;
      transform: translate(-50%, calc(-50% - 3px));
    }

    .img {
      width: 48px;
      height: 48px;
      border-radius: 10px;
      background: linear-gradient(135deg, #d7cfcf, #9198e5);
      flex-shrink: 0;
      transition: background 0.3s ease;
    }

    .card:hover > .img {
      background: linear-gradient(135deg, #9198e5, #712020);
    }

    .textBox {
      margin-left: 12px;
      color: white;
      width: 100%;
      overflow: hidden;
    }

    .textContent {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .span {
      font-size: 9px;
      opacity: 0.6;
    }

    .h1 {
      font-size: 14px;
      font-weight: 600;
      color: #ff5555;
    }

    .p {
      font-size: 11px;
      font-weight: 300;
      opacity: 0.9;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>

  <div class="loader-container" id="loaderContainer">
    <div class="loader">
      <div class="circle"><div class="dot"></div><div class="outline"></div></div>
      <div class="circle"><div class="dot"></div><div class="outline"></div></div>
      <div class="circle"><div class="dot"></div><div class="outline"></div></div>
      <div class="circle"><div class="dot"></div><div class="outline"></div></div>
    </div>
  </div>

  <div class="card" id="errorCard">
    <div class="img"></div>
    <div class="textBox">
      <div class="textContent">
        <p class="h1">ERROR 403</p>
        <span class="span">More than a month ago</span>
      </div>
      <p class="p">Owner of this business is inactive!</p>
    </div>
  </div>

  <script>
    setTimeout(() => {
      const loader = document.getElementById('loaderContainer');
      const card = document.getElementById('errorCard');

      loader.classList.add('hide');
      card.classList.add('show');
    }, 2000);
  </script>

</body>
</html>
